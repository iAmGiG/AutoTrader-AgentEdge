# Pre-commit hooks for automatic code quality
# Install: pip install "pre-commit>=3.2" && pre-commit install
# Bypass: git commit --no-verify (if needed)
# Run manually: pre-commit run --all-files

repos:
  # Markdown linting with auto-fix (newer revs need Node 22+; this host has Node 18)
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.12.1
    hooks:
      - id: markdownlint-cli2
        args: ['--fix']
        files: \.md$

  # Ruff: lint with auto-fix (including import order, rule I), then format.
  # Replaces black and isort (#603); keep rev equal to the ruff pin in pyproject.toml
  # and the lint / auto-fix workflows.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
        files: \.py$
      - id: ruff-format
        files: \.py$

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$  # Markdown sometimes needs trailing spaces
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Security scanning (runs fast, non-blocking)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-lll, --recursive]  # Only report high severity
        files: ^src/.*\.py$
        exclude: ^(tests/|deprecated/|src/deprecated/)

# Configuration
minimum_pre_commit_version: "3.2.0"
default_language_version:
  python: python3

exclude: |
  (?x)(
    ^\.git/|
    ^\.cache/|
    ^\.pytest_cache/|
    ^__pycache__/|
    ^venv/|
    ^env/|
    \.egg-info/|
    ^build/|
    ^dist/|
    ^deprecated/|
    ^src/deprecated/
  )
