name: Auto-Fix Code Quality on Push

on:
  push:
    branches:
      - feature/**
      - development
      - main

jobs:
  auto-fix:
    name: Auto-Fix Formatting & Linting
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
        cache: 'pip'

    # Ruff runs through pre-commit: the version comes from .pre-commit-config.yaml (the
    # same as local commits, so nothing is re-formatted, #603), and pre-commit passes
    # tracked files, including the force-added ones under the gitignored tests/
    - name: Install pre-commit
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit==4.7.0

    - name: Run Ruff auto-fixes (lint, import order)
      run: pre-commit run ruff-check --all-files || true

    - name: Run Ruff formatter
      run: pre-commit run ruff-format --all-files || true

    - name: Check for changes
      id: verify_diff
      run: |
        git diff --quiet . || echo "changed=true" >> $GITHUB_OUTPUT

    - name: Commit auto-fixes
      if: steps.verify_diff.outputs.changed == 'true'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -A
        git commit -m "style: Auto-fix code quality issues [skip ci]"

    - name: Push changes
      if: steps.verify_diff.outputs.changed == 'true'
      uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c # v1.3.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}
