name: Code Quality Checks (Non-Blocking)

on:
  pull_request:
    branches: [ main, development ]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # ruff at the rev pinned in .pre-commit-config.yaml (one version everywhere, #603)
        RUFF_VERSION=$(grep -A1 'astral-sh/ruff-pre-commit' .pre-commit-config.yaml | sed -n 's/.*rev: v//p')
        pip install "ruff==${RUFF_VERSION}" pre-commit==4.7.0 pylint mypy
        # Install project dependencies for imports
        pip install -e .

    # Tracked files are listed (ruff skips the gitignored tests/ when it walks
    # directories); findings show as PR annotations
    - name: Run Ruff (fast linter)
      run: |
        git ls-files -z -- 'src/*.py' 'tests/*.py' 'scripts/*.py' 'config_defaults/*.py' main.py | xargs -0 ruff check --output-format=github
      continue-on-error: true

    - name: Run Pylint (errors only)
      run: |
        pylint src/ --errors-only --score=n --output-format=colorized
      continue-on-error: true

    - name: Check code formatting with Ruff
      run: |
        git ls-files -z -- 'src/*.py' 'tests/*.py' 'scripts/*.py' 'config_defaults/*.py' main.py | xargs -0 pre-commit run ruff-format --show-diff-on-failure --files
      continue-on-error: true

    - name: Run type checking with mypy
      run: |
        mypy src/ --ignore-missing-imports --no-strict-optional
      continue-on-error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    - name: Install bandit
      run: pip install bandit[toml]

    - name: Run security scan
      run: |
        bandit -r src/ -f json -o bandit-report.json || true
        bandit -r src/ -f screen
      continue-on-error: true

    - name: Upload security report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: bandit-security-report
        path: bandit-report.json

  complexity:
    name: Code Complexity Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    - name: Install radon
      run: pip install radon

    - name: Check cyclomatic complexity
      run: |
        radon cc src/ -a -nb
      continue-on-error: true

    - name: Check maintainability index
      run: |
        radon mi src/ -nb
      continue-on-error: true
