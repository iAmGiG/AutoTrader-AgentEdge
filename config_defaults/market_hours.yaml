# Market Hours Configuration
# Defines trading hours, holidays, and market calendar settings

# Primary market timezone (NYSE/NASDAQ default)
timezone: "America/New_York"

# Regular trading hours (Eastern Time)
regular_hours:
  open_hour: 9
  open_minute: 30
  close_hour: 16
  close_minute: 0
  description: "Regular market hours: 9:30 AM - 4:00 PM ET"

# Extended trading hours (pre-market and after-hours)
extended_hours:
  enabled: false
  pre_market:
    open_hour: 4
    open_minute: 0
    description: "Pre-market: 4:00 AM - 9:30 AM ET"
  after_hours:
    close_hour: 20
    close_minute: 0
    description: "After-hours: 4:00 PM - 8:00 PM ET"

# Weekend days (ISO 8601: Monday=0, Sunday=6)
weekend:
  saturday: 5
  sunday: 6
  description: "Market closed on weekends"

# Holiday calendar
# Alpaca's market calendar is authoritative. When it can't be reached,
# src/utils/market_hours.py computes the regular NYSE holidays and 1:00 PM early
# closes by rule, so only one-off closures (e.g. a national day of mourning) go here.
holidays:
  enabled: false
  # When enabled, these dates are treated as market closed (YYYY-MM-DD)
  fixed_holidays: []
  observed_holidays: []
  description: "One-off NYSE closures the rules can't predict"

# International markets (for future expansion)
international_markets:
  enabled: false
  markets:
    LSE:  # London Stock Exchange
      timezone: "Europe/London"
      open_hour: 8
      open_minute: 0
      close_hour: 16
      close_minute: 30
    TSE:  # Tokyo Stock Exchange
      timezone: "Asia/Tokyo"
      open_hour: 9
      open_minute: 0
      close_hour: 15
      close_minute: 0

# Validation and testing settings
validation:
  allow_weekend_orders: false
  allow_holiday_orders: false
  warn_only: true  # If true, warn but don't block orders during off-hours
  description: "Off-hours order handling policy"

# Metadata
metadata:
  last_updated: "2026-10-14"
  version: "1.0.0"
  notes:
    - "Market hours extracted from alpaca_execution_manager.py constants"
    - "Regular NYSE holidays and early closes are computed by rule in market_hours.py"
    - "Extended hours and international markets disabled by default"
